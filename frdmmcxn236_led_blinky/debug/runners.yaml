# Available runners configured by board.cmake.
runners:
- linkserver
- jlink

# Default flash runner if --runner is not given.
flash-runner: linkserver

# Default debug runner if --runner is not given.
debug-runner: linkserver

# Common runner configuration values.
config:
  board_dir: D:/work_space/NXP/SDK/frdm_mcxn236/mcuxsdk/examples/_boards/frdmmcxn236
  # Build outputs:
  bin_file: frdmmcxn236_led_blinky.bin
  elf_file: frdmmcxn236_led_blinky.elf
  hex_file: frdmmcxn236_led_blinky.hex
  # Host tools:
  gdb: C:/Users/LENOVO/.mcuxpressotools/arm-gnu-toolchain-14.2.rel1-mingw-w64-x86_64-arm-none-eabi/bin/arm-none-eabi-gdb.exe

# Runner specific arguments
args:
  linkserver:
    - --dt-flash=y
    - --device=MCXN236:FRDM-MCXN236
  jlink:
    - --dt-flash=y
    - --device=MCXN236
